[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pvcracks-training"
version = "0.2.0"
description = "Optional training and hyperparameter-optimization utilities for pvcracks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD 3-Clause" }
authors = [{ name = "Norman Jost" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pvcracks==0.2.0",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
]
hpo = [
    "optuna>=3.5",
    "ray[data,train,tune]>=2.9",
    "wandb>=0.16",
]

[project.urls]
Documentation = "https://pvcracks.readthedocs.io/"
Repository = "https://github.com/sandialabs/pvcracks"
Issues = "https://github.com/sandialabs/pvcracks/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pvcracks_training*"]
