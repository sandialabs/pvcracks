name: Tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install CPU runtime and training helpers
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]' -e ./training build
      - name: Check runtime, model compatibility, and training exports
        run: python -m pytest -q
      - name: Build distributions
        run: |
          python -m build --wheel
          python -m build --wheel ./training
