name: Render JOSS draft

on:
  push:
    paths:
      - 'joss/**'
      - '.github/workflows/joss-draft.yml'
  pull_request:
    paths:
      - 'joss/**'
      - '.github/workflows/joss-draft.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Compile JOSS PDF and JATS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile draft with the official Open Journals Inara image
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/data" \
            --user "$(id -u):$(id -g)" \
            --env JOURNAL=joss \
            openjournals/inara:1.3.1 \
            -o pdf,jats \
            joss/paper.md
          mkdir --parents joss/jats
          cp joss/paper.jats joss/jats/paper.jats

      - name: Upload JOSS publishing artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joss-pvcracks-draft
          path: |
            joss/paper.pdf
            joss/jats/paper.jats
          if-no-files-found: error
