# .readthedocs.yml
version: 2

build:
  # Read the Docs' ASDF CPython runtimes currently require GLIBC 2.38 on
  # this builder. Miniforge ships a compatible Python runtime instead.
  os: ubuntu-22.04
  tools:
    python: "miniforge3-25.11"

conda:
  environment: docs/environment.yml

sphinx:
  # path to your conf.py
  configuration: docs/conf.py
