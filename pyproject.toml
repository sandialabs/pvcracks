[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pvcracks"
version = "0.2.0"
description = "Open tools for photovoltaic crack analysis, power-loss estimation, and SPICE simulation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "license.txt" }
authors = [
    { name = "Norman Jost" },
    { name = "Brandon K. Byford" },
    { name = "Rodrigo del Prado Santamaria" },
    { name = "Clifford W. Hansen" },
    { name = "Jennifer L. Braid" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "imutils>=0.5.4",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "pandas>=2.1",
    "pillow>=10",
    "pvimage>=0.0.10",
    "pvlib>=0.11",
    "requests>=2.31",
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "termcolor>=2.4",
    "timm>=0.9",
    "torch>=2.2",
    "torchvision>=0.17",
    "tqdm>=4.66",
    "xgboost>=2.0",
]

[project.optional-dependencies]
docs = [
    "lxml_html_clean>=0.4",
    "nbconvert<7",
    "nbsphinx>=0.9",
    "pypandoc-binary==1.10",
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.urls]
Documentation = "https://pvcracks.readthedocs.io/"
Repository = "https://github.com/sandialabs/pvcracks"
Issues = "https://github.com/sandialabs/pvcracks/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["docs/Examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
# The published runtime wheel deliberately contains only analysis, inference,
# and electrical-simulation modules. Dataset formatting, experiments, and
# retraining live in the separately installable ``pvcracks-training`` project.
include = [
    "pvcracks",
    "pvcracks.MultiSolSegment",
    "pvcracks.powerloss",
    "pvcracks.pvspice",
    "pvcracks.pvspice_lite",
    "pvcracks.utils",
    "pvcracks.vae",
    "pvcracks.vae.pytorch_ssim",
]

[tool.setuptools.package-data]
"pvcracks.MultiSolSegment" = ["model.pt"]
"pvcracks.powerloss" = ["*.pkl"]
"pvcracks.pvspice_lite" = ["SolarCell.cp"]
"pvcracks.vae" = ["model_download.txt"]
